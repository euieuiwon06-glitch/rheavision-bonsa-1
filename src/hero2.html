<script>
(() => {
  const INTERVAL = 2500; // 사진 넘어가는 간격 (ms)
  const track = document.getElementById('hsTrack');
  const slides = [...track.children];
  const n = slides.length;
  track.appendChild(slides[0].cloneNode(true)); // 마지막→첫 장 이음새 없이
  let i = 0, timer = null, paused = false;
  const go = (k, anim = true) => {
    track.classList.toggle('no-anim', !anim);
    i = k;
    track.style.transform = `translateX(${-i * 100}%)`;
  };
  track.addEventListener('transitionend', () => {
    if (i >= n) go(0, false);
  });
  const next = () => {
    if (i >= n) { go(0, false); track.offsetWidth; }
    go(i + 1);
  };
  const prev = () => {
    if (i <= 0) { go(n, false); track.offsetWidth; }
    go(i - 1);
  };
  const start = () => { clearInterval(timer); if (!paused) timer = setInterval(next, INTERVAL); };
  document.getElementById('hsNext').onclick = () => { next(); start(); };
  document.getElementById('hsPrev').onclick = () => { prev(); start(); };
  const pb = document.getElementById('hsPause');
  pb.onclick = () => {
    paused = !paused;
    pb.firstElementChild.className = paused ? 'material-symbols-outlined' : 'hs-pause';
    pb.firstElementChild.textContent = paused ? 'play_arrow' : '';
    pb.setAttribute('aria-label', paused ? '재생' : '일시정지');
    start();
  };
  document.addEventListener('visibilitychange', () => document.hidden ? clearInterval(timer) : start());
  start();
})();
</script>
